# Packaging for the desktop shell.
#
# This app is not a bundle of static files: it ships its own Next.js server and
# its own worker, both of which are ordinary Node programs reading the project
# the way they always have. So the package is the project — source included —
# rather than a compiled artifact.
appId: com.clipper.desktop
productName: Clipper
copyright: ""

directories:
  output: dist-desktop
  buildResources: electron/resources

# asar packs the app into one archive, which breaks two things here: Prisma
# loads a native .node query engine by path, and the worker is TypeScript that
# Node strips at load time. Both need real files on disk.
asar: false

files:
  - electron/**
  - .next/**
  - public/**
  - prisma/**
  # The worker runs `scripts/worker.ts` directly and imports across `src`, so
  # both ship as source. Nothing here is secret — `.env` is deliberately absent.
  - scripts/**
  - src/**
  - package.json
  - node_modules/**
  # Trim what is only ever used to build or test, so the package is not carrying
  # a second copy of the toolchain.
  - "!node_modules/electron/dist/**"
  - "!node_modules/.cache/**"
  - "!**/*.map"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/__tests__/**"

# `prisma generate` writes the client and its native query engine into a dot
# directory under node_modules, and electron-builder drops those from `files`
# whatever pattern you give it. Copying it in as a resource lands it exactly
# where Prisma looks. Without this the app launches and then cannot reach the
# database at all.
extraResources:
  - from: node_modules/.prisma
    to: app/node_modules/.prisma
  # The database the app runs itself. The machine it lands on cannot be assumed
  # to have PostgreSQL, and the schema cannot move to SQLite — eight String[]
  # columns and fourteen enums, six of the arrays being the censor word lists.
  - from: vendor/pgsql
    to: pgsql
  # ffmpeg, ffprobe, yt-dlp, and the two engines that used to be Python:
  # whisper.cpp (one exe plus a ggml model) and Piper's own release build.
  # A fresh machine needs nothing on PATH and no Python at all.
  - from: vendor/tools
    to: tools
  # A Piper voice, so narration works out of the box.
  - from: vendor/voices
    to: voices

# Puts `.env` beside the executable. electron-builder empties the output
# directory on every run, so this cannot be a one-off manual copy.
afterPack: electron/after-pack.cjs

win:
  target:
    - target: dir
    # One self-contained exe for handing to someone: unpacks itself to a temp
    # dir and runs. Slower to first launch than the dir build, but it is a
    # single file, which is what "send it to a friend" needs.
    - target: portable
  artifactName: ${productName}-${version}-${arch}.${ext}
