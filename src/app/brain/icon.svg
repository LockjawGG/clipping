<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Jarvis: an orchestrator core with agents on the ring — legible at 16px. -->
  <circle cx="32" cy="32" r="30" fill="#12141f"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#5865f2" stroke-width="2.5" opacity="0.55"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#5865f2" stroke-width="2" opacity="0.4"/>
  <!-- spokes: delegation lines from the core to the ring agents -->
  <g stroke="#5865f2" stroke-width="2" opacity="0.5">
    <line x1="32" y1="32" x2="32" y2="12"/>
    <line x1="32" y1="32" x2="49.3" y2="42"/>
    <line x1="32" y1="32" x2="14.7" y2="42"/>
  </g>
  <!-- agents -->
  <g fill="#8b96ff">
    <circle cx="32" cy="12" r="4"/>
    <circle cx="49.3" cy="42" r="4"/>
    <circle cx="14.7" cy="42" r="4"/>
  </g>
  <!-- the core -->
  <circle cx="32" cy="32" r="9" fill="#5865f2"/>
  <circle cx="32" cy="32" r="4.5" fill="#e8ebff"/>
</svg>
